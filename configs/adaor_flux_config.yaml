model:
  pretrained_model_name_or_path: "black-forest-labs/FLUX.1-dev"
  torch_dtype: "bfloat16"
  quantize: true                # Enable 4-bit NF4 BitsAndBytes quantization

evaluation:
  output_dir: "outputs_adaor_stratified"
  mapping_file: "pie-bench"
  images_dir: "datasets/pie_bench"
  samples_per_category: 20
  stratified: true
  
  num_inference_steps: 28        # 28 for FLUX.1-dev, 4 for FLUX.1-schnell
  guidance_scale: 1.5
  height: 512
  width: 512
  
  # Continuous edit strength sweep for alpha (AdaOr scaling)
  alpha_steps: [0.0, 0.25, 0.5, 0.75, 1.0]
